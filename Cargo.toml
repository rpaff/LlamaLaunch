[package]
name = "llama-launch"
version = "0.1.9"
edition = "2021"

[[bin]]
name = "llama-launch"
path = "src/main.rs"

[dependencies]
eframe = "0.30"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
opt-level = "s"
